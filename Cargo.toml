[workspace]
resolver = "3"
exclude = ["vendor/sdc-util"]
members = ["types", "crypto", "config", "consensus/wcss", "consensus/wiawvss", "consensus/whcc", "recovery", "network", "node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
types = { path = "types" }
crypto = { path = "crypto" }
config = { path = "config" }
wcss = { path = "consensus/wcss" }
wiawvss = { path = "consensus/wiawvss" }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
getrandom = "0.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
# Pin the shared primitive implementation; do not copy its protocol logic here.
sdc-types = { package = "types", git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }
wavid = { git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }
wrbc = { git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }
wra = { git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }

whcc = { path = "consensus/whcc" }
recovery = { path = "recovery" }
network = { path = "network" }
tokio = { version = "1", features = ["full"] }
num-rational = "0.4"
bincode = "1.3"
aes-gcm = "0.10"
sdc-config = { package = "config", git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }
sdc-util = { package = "util", git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }
wgather = { package = "wgather", git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }
wbinaa = { package = "wbinaa", git = "https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git", rev = "79e905a8bcd6d3fc0a5423f8cfcb383ad33a919e" }

crypto-bigint = { version = "0.7.5", default-features = false }

# Apply the same transport fix to all upstream primitive services.
[patch."https://github.com/linghe-yang/Secure-Distributed-Computing-Protocols.git"]
util = { path = "vendor/sdc-util" }
