[package]
name = "wavid"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { package = "config", git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
types = { package = "types", git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
crypto = { package = "crypto", git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
util = { package = "util", git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
num-bigint = "0.2.6"
num-traits = "0.2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
# Field extension basis is part of the v3 coding context; keep the audited version.
reed-solomon-erasure = "=4.0.2"
