[package]
name = "wrbc"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
types = { git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
crypto = { git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
util = { git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
num-bigint = "0.2.6"
num-traits = "0.2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
wavid = { git = "https://github.com/anonymous/Secure-Distributed-Computing-Protocols.git", rev = "anonymous" }
